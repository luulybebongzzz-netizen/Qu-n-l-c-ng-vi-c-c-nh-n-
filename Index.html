/* ---------- Quy đổi m² / thùng / viên ----------
 * Theo sheet MaHang: "Viên/thùng" và "m²/thùng" của từng mã hàng. */
const unitKind = (u) => {
  u = String(u || '').trim().toLowerCase();
  if (/^(m2|m²|m)$/.test(u)) return 'm2'; // "20m" trong tin Zalo là 20 m²
  if (/^(thùng|th)$/.test(u)) return 'box';
  if (/^(viên|v)$/.test(u)) return 'pcs';
  return '';
};
function convOf(o) {
  const it = catalogOf('code', o.code) || {};
  return { perBox: Number(o.perBox || it.perBox) || 0, m2PerBox: Number(o.m2PerBox || it.m2PerBox) || 0 };
}
/* Số lượng (theo ĐVT) → { th, v }; m² lẻ làm tròn lên đủ viên. Không đủ thông tin quy đổi thì trả null */
function toBoxes(qty, unit, { perBox, m2PerBox }) {
  const q = Number(qty) || 0, k = unitKind(unit);
  let boxes;
  if (k === 'box') boxes = q;
  else if (k === 'pcs') { if (!perBox) return { th: 0, v: q }; boxes = q / perBox; }
  else if (k === 'm2' && m2PerBox) boxes = q / m2PerBox;
  else return null;
  if (!perBox) return { th: Math.ceil(boxes - 1e-9), v: 0 };
  const pcs = Math.ceil(boxes * perBox - 1e-6);
  return { th: Math.floor(pcs / perBox), v: pcs % perBox };
}
/* { th, v } → số lượng theo ĐVT của dòng */
function fromBoxes(th, v, unit, { perBox, m2PerBox }) {
  const k = unitKind(unit) || 'box';
  if (v && !perBox) return null;
  const boxes = th + (perBox ? v / perBox : 0);
  if (k === 'box') return Math.round(boxes * 1000) / 1000;
  if (k === 'pcs') return perBox ? th * perBox + v : (th ? null : v);
  if (k === 'm2') return m2PerBox ? Math.round(boxes * m2PerBox * 1000) / 1000 : null;
  return null;
}
function convText(o) {
  const cv = convOf(o), r = toBoxes(o.qty, o.unit, cv);
  if (!r || (unitKind(o.unit) === 'box' && !r.v) || (unitKind(o.unit) === 'pcs' && !r.th)) return '';
  let t = `${fmtQty(r.th)} TH${r.v ? ` ${fmtQty(r.v)} V` : ''}`;
  if (unitKind(o.unit) !== 'm2' && cv.m2PerBox && cv.perBox) t += ` · ${fmtQty((r.th + r.v / cv.perBox) * cv.m2PerBox)} m²`;
  return t;
}
/* Form đơn: gõ SL/ĐVT → hiện thùng/viên; gõ thùng/viên → tự tính SL */
function syncBoxes(f) {
  const cv = { perBox: Number(f.perBox.value) || 0, m2PerBox: Number(f.m2PerBox.value) || 0 };
  const r = f.qty.value !== '' ? toBoxes(f.qty.value, f.unit.value, cv) : null;
  if (document.activeElement !== f.boxTh && document.activeElement !== f.boxV) {
    f.boxTh.value = r ? r.th : ''; f.boxV.value = r && r.v ? r.v : '';
  }
  const k = unitKind(f.unit.value);
  $('boxHint').textContent = r ? `≈ ${r.th} thùng${r.v ? ' ' + r.v + ' viên' : ''}`
    : (f.qty.value && k === 'm2' && !cv.m2PerBox ? 'Nhập m²/thùng để đổi ra thùng' : '');
}
function boxesToQty(f) {
  const th = Number(f.boxTh.value) || 0, v = Number(f.boxV.value) || 0;
  if (!f.unit.value.trim()) f.unit.value = v && !th ? 'viên' : 'thùng';
  const cv = { perBox: Number(f.perBox.value) || 0, m2PerBox: Number(f.m2PerBox.value) || 0 };
  let q = fromBoxes(th, v, f.unit.value, cv);
  if (q === null) {
    // Chưa có quy đổi sang ĐVT đang chọn: đổi ĐVT cho khớp với cách nhập
    f.unit.value = v && !th ? 'viên' : 'thùng';
    q = fromBoxes(th, v, f.unit.value, cv);
  }
  if (q === null) { $('boxHint').textContent = 'Nhập Viên/thùng để cộng cả thùng và viên'; return; }
  f.qty.value = q;
  syncBoxes(f);
}

/* ---------- Xuất Excel theo mẫu EX ---------- */
let xlsxLib = null;
function loadXlsx() {
  return xlsxLib || (xlsxLib = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    sc.onload = () => resolve(window.XLSX);
    sc.onerror = () => { xlsxLib = null; reject('Không tải được bộ tạo file Excel, kiểm tra kết nối mạng'); };
    document.head.appendChild(sc);
  }));
}

const EX_HEAD = [['Nơi lấy hàng', 'Nơi nhận hàng', 'Mã SAP', 'Mã Hàng', 'Số Lượng', '', 'Lô', 'Khách Hàng'], ['', '', '', '', 'TH', 'V', '', '']];
const EX_MERGES = [0, 1, 2, 3, 6, 7].map(c => ({ s: { r: 0, c }, e: { r: 1, c } })).concat([{ s: { r: 0, c: 4 }, e: { r: 0, c: 5 } }]);
const exQty = (o) => toBoxes(o.qty, o.unit, convOf(o));
const custLabel = (o) => o.customerSap ? `${o.customer} - ${o.customerSap}` : o.customer;

/* Dòng EX; merge = true thì cộng các dòng cùng nơi lấy + nơi nhận + mã hàng + lô thành một */
function exRows(lines, merge) {
  const out = [], idx = {};
  lines.forEach(o => {
    const cv = convOf(o), r = exQty(o);
    const k = [o.warehouse, o.toWarehouse, o.codeSap || o.code, o.lot].join('|').toLowerCase();
    if (merge && r && idx[k] !== undefined) {
      const x = out[idx[k]];
      if (!x.customers.includes(custLabel(o))) x.customers.push(custLabel(o));
      if (cv.perBox) { const pcs = x.th * cv.perBox + x.v + r.th * cv.perBox + r.v; x.th = Math.floor(pcs / cv.perBox); x.v = pcs % cv.perBox; }
      else { x.th += r.th; x.v += r.v; }
      x.src.push(o);
      return;
    }
    // Chưa có quy đổi: ghi nguyên số lượng + ĐVT vào cột TH (tô vàng)
    const x = { warehouse: o.warehouse, toWarehouse: o.toWarehouse, codeSap: o.codeSap, code: o.code, th: r ? r.th : `${fmtQty(o.qty)} ${o.unit || ''}`.trim(), v: r ? r.v : '',
      lot: o.lot || '', customers: [custLabel(o)], src: [o], noConv: !r };
    if (r && merge) idx[k] = out.length;
    out.push(x);
  });
  return out;
}

/* Định dạng ô (xlsx-js-style): tiêu đề nền xanh, chữ đậm, kẻ khung */
const XS = (() => {
  const line = { style: 'thin', color: { rgb: '7F7F7F' } };
  const border = { top: line, bottom: line, left: line, right: line };
  const font = { name: 'Times New Roman', sz: 12 };
  return {
    head: { font: { ...font, bold: true }, fill: { fgColor: { rgb: 'BDD7EE' } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border },
    title: { font: { ...font, bold: true, sz: 14 } },
    cell: { font, border, alignment: { vertical: 'center' } },
    num: { font, border, alignment: { horizontal: 'center', vertical: 'center' } },
    warn: { font, border, fill: { fgColor: { rgb: 'FFF2CC' } }, alignment: { horizontal: 'center', vertical: 'center' } },
    total: { font: { ...font, bold: true }, border, fill: { fgColor: { rgb: 'F2F2F2' } }, alignment: { horizontal: 'center', vertical: 'center' } }
  };
})();

/* Bảng có định dạng: headRows dòng tiêu đề bắt đầu từ dòng `top`; style(r, c, v) cho từng ô dữ liệu */
function styledSheet(X, aoa, { top = 0, headRows = 1, cols, merges = [], style } = {}) {
  const ws = X.utils.aoa_to_sheet(aoa);
  const range = X.utils.decode_range(ws['!ref']);
  for (let r = 0; r <= range.e.r; r++) for (let c = 0; c <= range.e.c; c++) {
    const ref = X.utils.encode_cell({ r, c });
    if (r < top) { if (ws[ref]) ws[ref].s = XS.title; continue; }
    if (!aoa[r] || !aoa[r].length) continue;
    if (!ws[ref]) ws[ref] = { t: 's', v: '' };
    ws[ref].s = r < top + headRows ? XS.head : (style ? style(r - top - headRows, c, ws[ref].v) : (typeof ws[ref].v === 'number' ? XS.num : XS.cell));
  }
  ws['!merges'] = merges;
  if (cols) ws['!cols'] = cols.map(w => ({ wch: w }));
  ws['!rows'] = aoa.map((row, r) => r >= top && r < top + headRows ? { hpt: 22 } : { hpt: 18 });
  return ws;
}

function exSheet(X, rows) {
  const aoa = EX_HEAD.concat(rows.map(x => [x.warehouse || '', x.toWarehouse || '', x.codeSap || '', x.code, x.th === 0 ? '' : x.th, x.v || '', x.lot, x.customers.join(', ')]));
  return styledSheet(X, aoa, { headRows: 2, merges: EX_MERGES, cols: [13, 14, 12, 28, 10, 7, 14, 42],
    style: (i, c) => rows[i].noConv && c === 4 ? XS.warn : ([3, 7].includes(c) ? XS.cell : XS.num) });
}

const DETAIL_HEAD = ['Ngày đặt', 'Mã đơn', 'Khu vực', 'Loại đơn', 'Khách hàng', 'Mã KH SAP', 'Mã hàng', 'Mã hàng SAP', 'SL đặt', 'ĐVT', 'Thùng', 'Viên', 'SL đã lấy', 'SL còn lại', 'Trạng thái', 'Nơi lấy hàng (điều chuyển về)', 'Nơi nhận hàng', 'Ngày khách nhận', 'Người gửi', 'Lô', 'Ghi chú'];
function detailSheet(X, lines) {
  const aoa = [DETAIL_HEAD].concat(lines.map(o => {
    const r = exQty(o) || { th: '', v: '' };
    return [fmtDate(o.createdAt), o.orderNo, areaOf(o) ? 'KV ' + areaOf(o) : '', isTransfer(o) ? 'Điều chuyển' : 'Có sẵn kho', o.customer, o.customerSap, o.code, o.codeSap, Number(o.qty) || 0, o.unit, r.th, r.v || '',
      Number(o.picked) || 0, Math.max(0, (Number(o.qty) || 0) - (Number(o.picked) || 0)), o.status, o.warehouse, o.toWarehouse, fmtDate(o.pickupDate), o.sender, o.lot || '', o.note];
  }));
  return styledSheet(X, aoa, { cols: DETAIL_HEAD.map((h, i) => [4, 6].includes(i) ? 24 : i === 20 ? 40 : i === 15 ? 16 : 12) });
}

async function downloadBook(name, sheets) {
  try {
    const X = await loadXlsx();
    const wb = X.utils.book_new();
    sheets(X).forEach(([n, ws]) => X.utils.book_append_sheet(wb, ws, n));
    // Tên file không dấu để mở được trên mọi máy
    const file = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').replace(/[^\w.-]+/g, '_');
    X.writeFile(wb, file + '.xlsx');
    return true;
  } catch (e) { toast(e.message || e, true); return false; }
}

function linesOfKeys(keys) {
  return groupOrders(S.orders).filter(g => keys.includes(g.key)).flatMap(g => g.lines).filter(o => o.status !== 'Huỷ');
}

function warnNoConv(rows) {
  const miss = [...new Set(rows.filter(x => x.noConv).map(x => x.code))];
  return miss.length ? ` · chưa đổi được thùng/viên cho ${miss.join(', ')} (nhập m²/thùng trong đơn)` : '';
}

async function exportGroup(key) {
  const lines = linesOfKeys([key]);
  if (!lines.length) return toast('Đơn này không có dòng nào để xuất', true);
  const rows = exRows(lines, false);
  if (await downloadBook(`EX_${lines[0].customer}_${todayStr()}`, X => [['EX', exSheet(X, rows)], ['Chi tiết', detailSheet(X, lines)]]))
    toast('Đã tải file EX' + warnNoConv(rows));
}

function toggleSelecting() { S.selecting = !S.selecting; S.sel = new Set(); render(); }
function toggleSel(key) { S.sel.has(key) ? S.sel.delete(key) : S.sel.add(key); render(); }

async function exportSelected(merge) {
  const lines = linesOfKeys([...S.sel]);
  if (!lines.length) return toast('Chưa chọn đơn nào', true);
  const rows = exRows(lines, merge);
  const n = S.sel.size;
  if (await downloadBook(`EX_${merge ? 'gop_' : ''}${n}don_${todayStr()}`, X => [['EX', exSheet(X, rows)], ['Chi tiết', detailSheet(X, lines)]])) {
    toast(`Đã tải file EX: ${n} đơn, ${rows.length} dòng` + warnNoConv(rows));
    S.selecting = false; S.sel = new Set(); render();
  }
}

/* Báo cáo cuối tháng: theo ngày đặt trong tháng, theo khu vực đang chọn */
async function exportMonth() {
  const m = $('oMonth').value || todayStr().slice(0, 7);
  const lines = S.orders.filter(inArea).filter(o => String(o.createdAt || '').startsWith(m));
  if (!lines.length) return toast(`Tháng ${m.split('-').reverse().join('/')} chưa có đơn nào`, true);
  const num = (x) => Number(x) || 0;
  const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
  const active = lines.filter(o => o.status !== 'Huỷ');
  // Tổng hợp theo khu vực
  const areas = [...new Set(lines.map(o => areaOf(o) || ''))].sort();
  const sumRow = (label, ls) => {
    const act = ls.filter(o => o.status !== 'Huỷ');
    const q = act.reduce((s, o) => s + num(o.qty), 0), p = act.reduce((s, o) => s + Math.min(num(o.picked), num(o.qty)), 0);
    return [label, groupOrders(ls).length, new Set(ls.map(o => o.customer)).size, ls.length,
      ls.filter(o => o.status === 'Đã lấy đủ').length, ls.filter(o => o.status === 'Lấy một phần').length, ls.filter(o => o.status === 'Chưa lấy').length, ls.filter(o => o.status === 'Huỷ').length, pct(p, q)];
  };
  const SUM_HEAD = ['Số đơn', 'Số khách', 'Số dòng hàng', 'Đã lấy đủ', 'Lấy một phần', 'Chưa lấy', 'Huỷ', '% đã lấy (theo SL)'];
  const byArea = [['Khu vực', ...SUM_HEAD]].concat(areas.map(a => sumRow(a ? 'KV ' + a : 'Chưa gán', lines.filter(o => (areaOf(o) || '') === a)))).concat([sumRow('Tổng', lines)]);
  const whs = [...new Set(lines.map(o => o.warehouse || ''))].sort();
  const byWh = [['Nơi lấy hàng (điều chuyển về)', ...SUM_HEAD]].concat(whs.map(w => sumRow(w || 'Chưa có', lines.filter(o => (o.warehouse || '') === w))));
  const byType = [['Loại đơn', ...SUM_HEAD]].concat([['Điều chuyển', true], ['Có sẵn kho', false]].map(([n, t]) => sumRow(n, lines.filter(o => isTransfer(o) === t))));
  const title = `BÁO CÁO ĐƠN HÀNG THÁNG ${m.split('-').reverse().join('/')}${S.area ? ' · KV ' + S.area : ''}`;
  // Theo khách + mã hàng
  const map = new Map();
  active.forEach(o => {
    const k = [areaOf(o), o.customer, o.warehouse, o.toWarehouse, o.code, o.unit].join('|').toLowerCase();
    if (!map.has(k)) map.set(k, { ...o, qty: 0, picked: 0, orders: new Set() });
    const x = map.get(k); x.qty += num(o.qty); x.picked += Math.min(num(o.picked), num(o.qty)); x.orders.add(orderKey(o));
  });
  const byCust = [['Khu vực', 'Khách hàng', 'Mã KH SAP', 'Nơi lấy hàng (điều chuyển về)', 'Nơi nhận hàng', 'Mã hàng', 'Mã hàng SAP', 'Số đơn', 'SL đặt', 'ĐVT', 'Thùng', 'Viên', 'SL đã lấy', 'SL còn lại', '% đã lấy']]
    .concat([...map.values()].sort((a, b) => String(areaOf(a)).localeCompare(String(areaOf(b))) || a.customer.localeCompare(b.customer) || a.code.localeCompare(b.code)).map(x => {
      const r = exQty(x) || { th: '', v: '' };
      return [areaOf(x) ? 'KV ' + areaOf(x) : '', x.customer, x.customerSap, x.warehouse || '', x.toWarehouse || '', x.code, x.codeSap, x.orders.size, x.qty, x.unit, r.th, r.v || '', x.picked, Math.max(0, x.qty - x.picked), pct(x.picked, x.qty)];
    }));
  const ok = await downloadBook(`BaoCao_DonHang_${m}${S.area ? '_KV' + S.area : ''}`, X => {
    // Trang Tổng hợp: bảng theo khu vực, bên dưới là bảng theo nơi lấy hàng
    const aoa1 = [[title], [], ...byArea, [], [], ...byWh, [], [], ...byType];
    const ws1 = styledSheet(X, aoa1, { top: 2, headRows: 1, cols: [28, 10, 10, 13, 11, 13, 10, 8, 18] });
    const h2 = 2 + byArea.length + 2;
    byWh[0].forEach((_, c) => { ws1[X.utils.encode_cell({ r: h2, c })].s = XS.head; });
    const h3 = h2 + byWh.length + 2;
    byType[0].forEach((_, c) => { ws1[X.utils.encode_cell({ r: h3, c })].s = XS.head; });
    byArea[byArea.length - 1].forEach((_, c) => { ws1[X.utils.encode_cell({ r: 2 + byArea.length - 1, c })].s = XS.total; });
    const ws2 = styledSheet(X, byCust, { cols: [8, 26, 12, 16, 14, 24, 13, 8, 10, 8, 8, 8, 10, 10, 10] });
    return [['Tổng hợp', ws1], ['Theo khách', ws2], ['Chi tiết', detailSheet(X, lines)], ['EX', exSheet(X, exRows(active, false))]];
  });
  if (ok) toast(`Đã tải báo cáo tháng ${m.split('-').reverse().join('/')}: ${groupOrders(lines).length} đơn`);
}

/* ---------- Đọc chữ từ ảnh (Tesseract.js, chạy ngay trên trình duyệt) ---------- */
let ocrLib = null;
function loadOcr() {
  return ocrLib || (ocrLib = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload = () => resolve(window.Tesseract);
    sc.onerror = () => { ocrLib = null; reject('Không tải được bộ đọc chữ, kiểm tra kết nối mạng'); };
    document.head.appendChild(sc);
  }));
}

async function runOcr(file) {
  const st = $('ocrStatus');
  st.textContent = 'Đang tải bộ đọc chữ (lần đầu mất vài giây)...';
  try {
    const T = await loadOcr();
    const { data } = await T.recognize(file, 'vie+eng', {
      logger: m => { if (m.status === 'recognizing text') st.textContent = `Đang đọc chữ trong ảnh... ${Math.round(m.progress * 100)}%`; }
    });
    const ta = $('pasteText');
    ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + data.text.trim();
    st.textContent = '✓ Đã đọc xong. Chị kiểm tra lại chữ và bảng bên dưới.';
    previewParsed();
  } catch (e) { st.textContent = 'Lỗi đọc ảnh: ' + (e.message || e); }
}

$('pasteText').addEventListener('paste', e => {
  const items = [...((e.clipboardData && e.clipboardData.items) || [])];
  const pdfs = items.filter(i => i.type === 'application/pdf').map(i => i.getAsFile());
  if (pdfs.length) { e.preventDefault(); return readPdfs(pdfs); }
  const img = items.find(i => i.type.startsWith('image/'));
  if (img) { e.preventDefault(); runOcr(img.getAsFile()); }
});

/* ---------- Đọc phiếu PDF (Biên bản giao nhận hàng kiêm phiếu xuất kho) ---------- */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
let pdfLib = null;
function loadPdf() {
  return pdfLib || (pdfLib = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; resolve(window.pdfjsLib); };
    sc.onerror = () => { pdfLib = null; reject('Không tải được bộ đọc PDF, kiểm tra kết nối mạng'); };
    document.head.appendChild(sc);
  }));
}

/* Lấy chữ trong PDF theo từng dòng (gom các mẩu chữ cùng độ cao, cột cách nhau bằng " | ") */
async function pdfLines(file) {
  const lib = await loadPdf();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const lines = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const { items } = await (await doc.getPage(n)).getTextContent();
    const rows = [];
    items.filter(it => it.str.trim()).forEach(it => {
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) rows.push(row = { y, parts: [] });
      row.parts.push({ x, w: it.width, s: it.str });
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => {
      r.parts.sort((a, b) => a.x - b.x);
      let text = '', end = null;
      r.parts.forEach(pt => { text += end === null ? pt.s : (pt.x - end > 12 ? ' | ' : (pt.x - end > 1 ? ' ' : '')) + pt.s; end = pt.x + pt.w; });
      lines.push(text.replace(/\s+/g, ' ').trim());
    });
  }
  return lines;
}

const vnNum = (t) => Number(String(t).replace(/\./g, '').replace(',', '.')) || 0;

/* Phiếu xuất kho → một đơn: kho xuất, kho nhận (số cuối tên khách), từng mã hàng; khách hàng để chị tự gõ */
function parseTransferPdf(lines) {
  const all = lines.join('\n');
  const pick = (re) => { const m = all.match(re); return m ? m[1].trim() : ''; };
  const docNo = pick(/Số chứng từ:\s*\|?\s*(\d+)/);
  const date = pick(/Ngày xuất:\s*\|?\s*(\d{1,2}\/\d{1,2}\/\d{4})/);
  const fromWh = pick(/Kho xuất hàng:\s*\|?\s*(\d{3,5})/);
  const buyer = pick(/Tên khách hàng:\s*\|?\s*([^\n]+)/);
  const toWh = (buyer.match(/-\s*(\d{3,5})\s*(?:\||$)/) || [])[1] || '';
  const desc = pick(/Diễn giải:\s*\|?\s*([^\n|]+)/);
  const map = new Map();
  lines.forEach(l => {
    let c = l.split(' | ').map(x => x.trim());
    const m0 = c[0].match(/^(\d{1,3})\s+(\d{5,12})$/); // STT và mã hàng dính nhau
    if (m0) c = [m0[1], m0[2], ...c.slice(1)];
    // STT | Mã hàng | Tên hàng | Lô | ĐVT | Số lượng (Lô có thể trống)
    if (c.length < 5 || !/^\d{1,3}$/.test(c[0]) || !/^\d{5,12}$/.test(c[1]) || !/^[\d.,]+$/.test(c[c.length - 1])) return;
    const qty = vnNum(c[c.length - 1]), unit = c[c.length - 2].toLowerCase();
    const lot = c.length >= 6 ? c[c.length - 3] : '';
    const name = c.slice(2, c.length >= 6 ? -3 : -2).join(' ');
    const code = (name.split(/[,\s]+/).find(t => /^\d{4}[A-Z]{2,}[A-Z0-9-]*\d$/i.test(t)) || c[1]).toUpperCase();
    const k = [c[1], lot].join('|');
    if (!map.has(k)) map.set(k, { code, codeSap: c[1], lot, qty: 0, unit: '' });
    const r = map.get(k);
    // Cùng mã + lô: dòng Thùng và dòng Viên gộp thành "x thùng y viên"
    if (unitKind(unit) === 'pcs' && r.unit) r.extraV = (r.extraV || 0) + qty;
    else if (!r.unit) { r.qty = qty; r.unit = unitKind(unit) === 'box' ? 'thùng' : unit; }
    else r.qty += qty;
  });
  const lines2 = [...map.values()].map(r => {
    if (r.extraV && unitKind(r.unit) !== 'box') { r.qty += r.extraV; delete r.extraV; }
    return r;
  });
  return {
    customer: '', customerSap: '', warehouse: fromWh, toWarehouse: toWh, pickupDate: '',
    note: [docNo && 'CT ' + docNo, date && 'xuất ' + date, desc].filter(Boolean).join(' · '),
    lines: lines2
  };
}

async function readPdfs(files) {
  const st = $('ocrStatus');
  st.textContent = 'Đang đọc file PDF...';
  try {
    const groups = [];
    for (const f of files) {
      const g = parseTransferPdf(await pdfLines(f));
      if (g.lines.length) groups.push(g);
    }
    if (!groups.length) { st.textContent = 'Không tìm thấy bảng hàng hoá trong PDF (cần phiếu xuất kho dạng chữ, không phải ảnh scan).'; return; }
    showGroups(groups, `Đọc được ${groups.length} phiếu, ${groups.reduce((n, g) => n + g.lines.length, 0)} mã hàng. Chị gõ tên khách hàng cho từng đơn rồi lưu:`, true);
    st.textContent = '✓ Đã đọc xong PDF.';
    const first = document.querySelector('#parsedRows .pgroup:last-child [data-k="customer"]');
    if (first && window.innerWidth > 768) first.focus();
  } catch (e) { st.textContent = 'Lỗi đọc PDF: ' + (e.message || e); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeForm(); closePaste(); closeOrder(); } });
init();
