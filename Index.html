<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quản lý công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --surface:#fff; --surface-2:#f8fafc; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --primary:#4f46e5; --primary-soft:#eef2ff; --danger:#dc2626;
  --warn:#d97706; --ok:#16a34a; --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
  --radius:14px; --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#0b1120; --surface:#111827; --surface-2:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --border:#263247; --primary:#818cf8; --primary-soft:#1e1b4b; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* Bố cục */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary)}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
.sidebar .spacer{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 28px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:22px;font-weight:700;flex:1}
.content{padding:4px 28px 32px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface);border:1px solid var(--border)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border)}
.icon-btn svg{width:18px;height:18px}

/* Bộ lọc */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;color:var(--muted)}
.filters select,.search input,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none}
.search input{padding-left:38px}
.filters select:focus,.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-size:28px;font-weight:700;margin-top:6px}
.panels{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.panel{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row .name{width:110px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px}
.bar-row .num{width:28px;text-align:right;font-weight:600;font-size:13px}
.mini-list .task-card{margin-bottom:8px}

/* Danh sách */
.table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 14px;background:var(--surface-2);text-transform:uppercase;letter-spacing:.03em}
td{padding:12px 14px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.t-title{font-weight:600}
.t-sub{color:var(--muted);font-size:12px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%}
.due{font-size:13px;white-space:nowrap}
.due.overdue{color:var(--danger);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.progress span{display:block;height:100%;background:var(--primary)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.who{display:flex;align-items:center;gap:8px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin:2px 4px 0 0}

/* Thẻ công việc (kanban + mobile) */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--shadow);border-left:4px solid var(--prio,#94a3b8)}
.task-card:active{transform:scale(.99)}
.task-card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.task-card .title{font-weight:600;line-height:1.35}
.task-card.dragging{opacity:.5}
.cards{display:none;flex-direction:column;gap:10px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(260px,1fr));gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.column{background:var(--surface-2);border-radius:var(--radius);padding:12px;min-height:200px;scroll-snap-align:start;border:2px dashed transparent}
.column.drop{border-color:var(--primary)}
.column-head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:12px;padding:2px 4px}
.column-head .count{margin-left:auto;background:var(--surface);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--muted)}
.column-body{display:flex;flex-direction:column;gap:10px;min-height:120px}
.move-btn{display:none;font-size:12px;color:var(--primary);font-weight:600;padding:4px 0}

.empty{text-align:center;color:var(--muted);padding:40px 16px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:18px;flex:1}
.modal-body{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
.modal-foot .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field textarea{min-height:90px;resize:vertical}
.field input[type=range]{padding:0}
.meta{grid-column:1/-1;font-size:12px;color:var(--muted)}

/* Toast + loading */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;transition:transform .25s;z-index:60;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:70}
.spinner{width:38px;height:38px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fab{display:none}
.mobile-only{display:none}
.bottom-nav{display:none}

/* Đơn hàng */
.type-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:26px 0 4px;padding:10px 14px;border-radius:12px;font-weight:700;font-size:17px;background:var(--surface);border-left:5px solid var(--primary)}
.type-head.type-transfer{border-left-color:#d97706}
.type-head.type-stock{border-left-color:#16a34a}
.type-head .t-sub{font-weight:400;font-size:12px;flex-basis:100%}
.type-head .count{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px}
.transfer-tag{font-size:11px;font-weight:600;color:#b45309;background:rgba(217,119,6,.12);border-radius:6px;padding:2px 6px;margin-right:6px}
.group-head{display:flex;align-items:center;gap:8px;font-weight:700;margin:22px 0 10px}
.group-head .count{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--muted);font-weight:600}
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.order-item{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:15px}
.order-card .row .title{flex:1}
.parsed-row{display:grid;grid-template-columns:1.4fr 1fr 1.4fr 1fr 1.2fr;gap:6px;margin-bottom:10px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:10px}
.parsed-row .icon-btn{justify-self:end}
.parsed-row input,.paste-opts input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;min-width:0;width:100%}
.parsed-row input:focus{border-color:var(--primary)}
.qty-unit{display:flex;gap:4px}
.qty-unit input:last-child{width:66px;flex:none}
.paste-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pgroup{position:relative;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface-2)}
.pgroup input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;min-width:0;width:100%}
.pgroup input:focus{border-color:var(--primary)}
.pgroup .field label{font-size:12px}
.pg-head{display:grid;grid-template-columns:1.8fr 1fr 1.2fr .8fr .8fr auto;gap:8px;align-items:end;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.pg-lines{margin-top:10px}
.pg-cols{display:grid;grid-template-columns:1.5fr 1fr 1.2fr 1fr 38px;gap:6px;padding:8px 9px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.pg-lines .parsed-row{grid-template-columns:1.5fr 1fr 1.2fr 1fr auto;margin-bottom:6px;padding:6px 8px;background:var(--surface)}
.pl-hint{grid-area:auto;grid-column:1/-1;font-size:12px;color:#b45309}
.pg-add{color:var(--primary);font-weight:600;font-size:13px;padding:4px 0}
.pg-foot{display:grid;grid-template-columns:1fr 2.5fr;gap:8px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--border)}
.paste-opts select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;width:100%}
.area-switch{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.area-switch button{padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.area-switch button.active{background:var(--primary);color:#fff}
.area-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--primary-soft);color:var(--primary);margin-right:6px;vertical-align:middle}
#pasteText{width:100%;min-height:140px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none;resize:vertical}
.modal.wide{max-width:980px}
.ocr-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.order-lines{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.order-line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;cursor:pointer;border-left:3px solid var(--lc,#94a3b8)}
.order-line:hover{filter:brightness(.97)}
.order-line .qty{font-weight:600;text-align:right;white-space:nowrap}
.order-line .sub{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.order-line .pick{color:var(--primary);font-weight:600;font-size:12px}
.card-actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.order-line .conv{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.order-card .sel{width:20px;height:20px;accent-color:var(--primary);flex:none}
.order-card.selected{outline:2px solid var(--primary);outline-offset:-2px}
.sel-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:22;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.month-pick{display:flex;gap:6px;align-items:center}
.month-pick input{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:inherit}
.pair{display:flex;gap:6px}
.pair input{flex:1;min-width:0}
.box-hint{font-size:12px;color:var(--muted);margin-top:4px}
.modal-body.block{display:block}
.modal-body.block > * + *{margin-top:12px}

/* ---------- Điện thoại / máy tính bảng ---------- */
@media (max-width:1024px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .panels{grid-template-columns:1fr}
}
@media (max-width:768px){
  .sidebar{display:none}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:19px}
  .topbar .btn-primary{display:none}
  .content{padding:0 16px calc(var(--nav-h) + 90px)}
  .stats{gap:10px}
  .stat{padding:14px}
  .stat .value{font-size:24px}
  .filters{gap:8px}
  .filters select{flex:1 1 calc(50% - 4px);min-width:0}
  .table-wrap{display:none}
  .cards{display:flex}
  .kanban{grid-template-columns:repeat(var(--cols,4),86%);gap:12px;margin:0 -16px;padding:0 16px 10px}
  .move-btn{display:inline-block}
  .order-grid{grid-template-columns:1fr}
  .paste-opts{grid-template-columns:1fr 1fr}
  .pg-head{grid-template-columns:1fr 1fr}
  .pg-head .pg-cust{grid-column:1/-1}
  .pg-head .pg-cust{padding-right:44px}
  .pg-head .icon-btn{position:absolute;top:10px;right:10px}
  .pg-cols{display:none}
  .pg-lines .parsed-row{grid-template-columns:1fr 1fr 44px;grid-template-areas:"code code x" "sap lot lot" "qty qty qty"}
  .pg-lines [data-k=lot]{grid-area:lot}
  .pg-lines [data-k=code]{grid-area:code}
  .pg-lines [data-k=codeSap]{grid-area:sap}
  .pg-lines .qty-unit{grid-area:qty}
  .pg-lines .parsed-row .icon-btn{grid-area:x}
  .pg-foot{grid-template-columns:1fr}
  .area-switch button{padding:6px 9px}
  .parsed-row{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--border);border-radius:10px}
  .parsed-row .icon-btn{grid-column:2;justify-self:end}
  #topAddManual{display:none!important}
  .mobile-only{display:inline-flex}
  .sel-bar{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));left:12px;right:12px;transform:none;max-width:none}
  .sel-bar .btn{flex:1 1 40%}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);z-index:20}
  .bottom-nav .nav-btn{flex-direction:column;gap:3px;justify-content:center;font-size:11px;border-radius:0;padding:6px 0}
  .bottom-nav .nav-btn.active{background:transparent}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.4);z-index:21}
  .fab svg{width:26px;height:26px}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:none;border-radius:18px 18px 0 0;max-height:94vh}
  .modal-body{grid-template-columns:minmax(0,1fr)}
  .modal-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(var(--nav-h) + 16px)}
}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">✓</div>Công việc</div>
    <div id="sideNav"></div>
    <div class="spacer"></div>
    <button class="nav-btn" onclick="toggleTheme()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Giao diện tối</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">Tổng quan</h1>
      <div class="area-switch" id="areaSwitch"></div>
      <button class="icon-btn" title="Tải lại" onclick="reload()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="btn btn-ghost" id="topAddManual" onclick="openOrder()" style="display:none">+ Thêm đơn tay</button>
      <button class="btn btn-primary" id="topAdd" onclick="addAction()">+ Thêm công việc</button>
    </header>

    <section class="content">
      <div class="filters" id="filters">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="fSearch" placeholder="Tìm công việc, nhãn..." oninput="render()">
        </div>
        <select id="fStatus" onchange="render()"></select>
        <select id="fPriority" onchange="render()"></select>
        <select id="fAssignee" onchange="render()"></select>
        <select id="fDue" onchange="render()">
          <option value="">Mọi hạn chót</option>
          <option value="overdue">Quá hạn</option>
          <option value="today">Hôm nay</option>
          <option value="week">7 ngày tới</option>
          <option value="none">Chưa có hạn</option>
        </select>
      </div>

      <div class="filters" id="orderFilters" style="display:none">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="oSearch" placeholder="Tìm khách hàng, mã hàng..." oninput="render()">
        </div>
        <select id="oStatus" onchange="render()">
          <option value="open">Chưa lấy xong</option>
          <option value="">Tất cả</option>
          <option>Chưa lấy</option>
          <option>Lấy một phần</option>
          <option>Đã lấy đủ</option>
          <option>Huỷ</option>
        </select>
        <select id="oWarehouse" onchange="render()"></select>
        <select id="oSender" onchange="render()"></select>
        <select id="oType" onchange="render()"><option value="">Điều chuyển + Có sẵn kho</option><option value="transfer">🚚 Chỉ đơn điều chuyển</option><option value="stock">🏠 Chỉ hàng có sẵn kho</option></select>
        <button class="btn btn-ghost" id="btnSelect" onclick="toggleSelecting()">☑ Chọn đơn xuất EX</button>
        <div class="month-pick"><input type="month" id="oMonth" title="Tháng báo cáo"><button class="btn btn-ghost" onclick="exportMonth()">📊 Báo cáo tháng</button></div>
        <button class="btn btn-ghost mobile-only" onclick="openOrder()">+ Thêm đơn tay</button>
      </div>

      <div id="view"></div>
    </section>
  </main>
</div>

<script>
/* ---------- Kết nối Apps Script ----------
 * Chạy trong Apps Script: gọi thẳng google.script.run.
 * Chạy ngoài (GitHub Pages): gọi API_URL (link /exec của Apps Script, quyền truy cập "Bất kỳ ai").
 * Để API_URL trống thì chạy chế độ demo, dữ liệu lưu trên trình duyệt.
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbxhzEwVlnuemdjUhg0z_CDqJsmuWSkOPMhiW3MeLWNrTC9AKsfoeN-FdBW94cZJy1xitw/exec';
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (IS_GAS) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e.message || e))[fn](...args);
    } else if (API_URL) {
      // text/plain để trình duyệt không gửi preflight CORS (Apps Script không hỗ trợ)
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
        .then(r => r.json())
        .then(r => r.ok ? resolve(r.data) : reject(r.error))
        .catch(() => reject('Không kết nối được Google Sheet. Kiểm tra link Apps Script và quyền truy cập "Bất kỳ ai".'));
    } else {
      try { resolve(Demo[fn](...args)); } catch (e) { reject(e.message); }
    }
  });
}

const Demo = {
  _load() {
    try { const s = JSON.parse(localStorage.getItem('demoTasks')); if (s) return s; } catch (e) {}
    const d = (n) => { const x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
    return [
      {id:'CV1',title:'Lập kế hoạch tháng 11',description:'',status:'Đang làm',priority:'Cao',assignee:'Yến',dueDate:d(2),startDate:d(-3),tags:'kế hoạch',progress:40},
      {id:'CV2',title:'Gửi báo cáo doanh thu',description:'',status:'Cần làm',priority:'Khẩn cấp',assignee:'Minh',dueDate:d(-1),startDate:'',tags:'báo cáo',progress:0},
      {id:'CV3',title:'Kiểm tra hàng tồn kho',description:'',status:'Chờ duyệt',priority:'Trung bình',assignee:'Yến',dueDate:d(0),startDate:'',tags:'kho',progress:90},
      {id:'CV4',title:'Họp với khách hàng ABC',description:'',status:'Hoàn thành',priority:'Thấp',assignee:'Lan',dueDate:d(-4),startDate:'',tags:'khách hàng',progress:100}
    ];
  },
  _save(t) { try { localStorage.setItem('demoTasks', JSON.stringify(t)); } catch (e) {} },
  getInitialData() {
    return {
      tasks: this._load(),
      orders: this._orders(),
      customers: [], items: [],
      members: [{name:'Yến'},{name:'Minh'},{name:'Lan'}],
      statuses: [{name:'Cần làm',color:'#64748b'},{name:'Đang làm',color:'#2563eb'},{name:'Chờ duyệt',color:'#d97706'},{name:'Hoàn thành',color:'#16a34a'}],
      priorities: [{name:'Thấp',color:'#94a3b8'},{name:'Trung bình',color:'#0ea5e9'},{name:'Cao',color:'#f97316'},{name:'Khẩn cấp',color:'#dc2626'}],
      user: 'demo'
    };
  },
  getTasks() { return this._load(); },
  saveTask(t) {
    const all = this._load(); const now = new Date().toISOString().slice(0, 19);
    if (!t.id) { t.id = 'CV' + Date.now().toString(36).toUpperCase(); t.createdAt = now; all.push(t); }
    else { const i = all.findIndex(x => x.id === t.id); t.createdAt = all[i] && all[i].createdAt; all[i] = t; }
    t.updatedAt = now; this._save(all); return t;
  },
  updateStatus(id, status) {
    const all = this._load(); const t = all.find(x => x.id === id);
    t.status = status; if (status === 'Hoàn thành') t.progress = 100; this._save(all); return t;
  },
  deleteTask(id) { this._save(this._load().filter(x => x.id !== id)); return id; },
  _orders() {
    try { const s = JSON.parse(localStorage.getItem('demoOrders')); if (s) return s; } catch (e) {}
    const d = (n) => { const x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
    return [
      {id:'DH1',createdAt:d(-2),customer:'Quỳnh An',code:'2080BANYAN002',qty:20,unit:'m2',warehouse:'1111',toWarehouse:'Cần Thơ',pickupDate:d(0),sender:'Ngọc Vĩ',note:'',picked:0,status:'Chưa lấy'},
      {id:'DH2',createdAt:d(-5),customer:'Nam Phú',code:'6060MARBLE011',qty:50,unit:'m2',warehouse:'Kho 2',pickupDate:d(-1),sender:'Ngọc Vĩ',note:'',picked:20,status:'Lấy một phần'}
    ];
  },
  getOrders() { return this._orders(); },
  saveOrders(list) {
    const all = this._orders(); const now = new Date().toISOString().slice(0, 19);
    return list.map((o, i) => {
      o.status = calcOrderStatus(o); o.updatedAt = now;
      const j = all.findIndex(x => x.id === o.id);
      if (j >= 0) all[j] = o; else { o.id = 'DH' + Date.now().toString(36).toUpperCase() + i; all.push(o); }
      localStorage.setItem('demoOrders', JSON.stringify(all)); return o;
    });
  },
  deleteOrder(id) { localStorage.setItem('demoOrders', JSON.stringify(this._orders().filter(x => x.id !== id))); return id; }
};

/* ---------- Trạng thái ---------- */
const S = { tasks: [], orders: [], customers: [], items: [], area: '', selecting: false, sel: new Set(), members: [], statuses: [], priorities: [], view: 'dashboard' };
const VIEWS = [
  { id: 'dashboard', label: 'Tổng quan', icon: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>' },
  { id: 'list', label: 'Danh sách', icon: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>' },
  { id: 'orders', label: 'Đơn hàng', icon: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>' },
  { id: 'kanban', label: 'Kanban', icon: '<rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/>' },
  { id: 'mine', label: 'Của tôi', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
];

/* ---------- Tiện ích ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const daysLeft = (s) => s ? Math.round((new Date(s) - new Date(todayStr())) / 864e5) : null;
const colorOf = (list, name) => (list.find(x => x.name === name) || {}).color || '#94a3b8';
const initials = (n) => String(n || '?').trim().split(/\s+/).slice(-2).map(w => w[0]).join('').toUpperCase();
const fmtDate = (s) => s ? s.split('-').reverse().join('/') : '';
const isDone = (t) => t.status === 'Hoàn thành';

function toast(msg, isErr) {
  const el = $('toast'); el.textContent = msg; el.className = 'toast show' + (isErr ? ' error' : '');
  clearTimeout(el._t); el._t = setTimeout(() => el.className = 'toast', 2600);
}

function badge(list, name) {
  const c = colorOf(list, name);
  return `<span class="badge" style="background:${c}1f;color:${c}"><span class="dot" style="background:${c}"></span>${esc(name)}</span>`;
}

function dueHtml(t) {
  if (!t.dueDate) return '<span class="due" style="color:var(--muted)">—</span>';
  const n = daysLeft(t.dueDate);
  let cls = '', extra = '';
  if (!isDone(t)) {
    if (n < 0) { cls = 'overdue'; extra = ` · trễ ${-n} ngày`; }
    else if (n === 0) { cls = 'soon'; extra = ' · hôm nay'; }
    else if (n <= 2) { cls = 'soon'; extra = ` · còn ${n} ngày`; }
  }
  return `<span class="due ${cls}">${fmtDate(t.dueDate)}${extra}</span>`;
}

function tagsHtml(t) {
  return String(t.tags || '').split(',').map(s => s.trim()).filter(Boolean).map(s => `<span class="tag">#${esc(s)}</span>`).join('');
}

/* ---------- Khởi động ---------- */
async function init() {
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  try {
    const d = await api('getInitialData');
    Object.assign(S, d);
    try { S.area = localStorage.getItem('area') || ''; } catch (e) { S.area = ''; }
    buildNav(); buildSelects(); buildAreaSwitch();
    try { S.view = localStorage.getItem('view') || 'dashboard'; } catch (e) {}
    setView(S.view);
    if (!IS_GAS && !API_URL) toast('Đang chạy chế độ demo (dữ liệu lưu trên trình duyệt)');
  } catch (e) { toast('Lỗi tải dữ liệu: ' + e, true); }
  $('loading').style.display = 'none';
}

async function reload() {
  try { [S.tasks, S.orders] = await Promise.all([api('getTasks'), api('getOrders')]); render(); toast('Đã cập nhật dữ liệu'); }
  catch (e) { toast(e, true); }
}

function buildNav() {
  const html = VIEWS.map(v => `<button class="nav-btn" data-view="${v.id}" onclick="setView('${v.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${v.icon}</svg>${v.label}</button>`).join('');
  $('sideNav').innerHTML = html; $('bottomNav').innerHTML = html;
}

function buildSelects() {
  const opts = (list, all) => (all ? `<option value="">${all}</option>` : '') + list.map(x => `<option>${esc(x.name)}</option>`).join('');
  $('fStatus').innerHTML = opts(S.statuses, 'Mọi trạng thái');
  $('fPriority').innerHTML = opts(S.priorities, 'Mọi mức ưu tiên');
  $('fAssignee').innerHTML = opts(S.members, 'Mọi người');
  $('iStatus').innerHTML = opts(S.statuses);
  $('iPriority').innerHTML = opts(S.priorities);
  $('iAssignee').innerHTML = '<option value="">— Chưa giao —</option>' + opts(S.members);
}

function setView(v) {
  S.view = v;
  try { localStorage.setItem('view', v); } catch (e) {}
  document.querySelectorAll('.nav-btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('pageTitle').textContent = VIEWS.find(x => x.id === v).label;
  $('filters').style.display = v === 'dashboard' || v === 'orders' ? 'none' : '';
  $('orderFilters').style.display = v === 'orders' ? '' : 'none';
  $('topAdd').textContent = v === 'orders' ? '+ Dán đơn Zalo' : '+ Thêm công việc';
  $('topAddManual').style.display = v === 'orders' ? '' : 'none';
  render();
  window.scrollTo(0, 0);
}

function addAction() {
  if (S.view === 'orders') openPaste(); else openForm();
}

/* ---------- Khu vực ---------- */
const AREAS = ['27', '23'];
// Đơn hàng tự xếp khu vực theo kho nhận hàng: kho trong danh sách → KV 27, kho khác → KV 23.
// Đơn chưa có kho nhận thì dùng ô Khu vực chọn tay.
const AREA_27_WAREHOUSES = ['1121'];
/* Kho nhà của từng khu vực: lấy hàng ở kho khác là đơn điều chuyển */
const HOME_WAREHOUSE = { '27': '1121', '23': '1118' };
const isTransfer = (o) => {
  const wh = String(o.warehouse || '').trim(), home = HOME_WAREHOUSE[areaOf(o)];
  return !!(wh && home && wh !== home);
};
const areaOf = (x) => {
  const wh = String(x.toWarehouse || '').trim();
  if (wh) return AREA_27_WAREHOUSES.includes(wh) ? '27' : '23';
  return x.area || '';
};

function buildAreaSwitch() {
  $('areaSwitch').innerHTML = [['', 'Tất cả'], ...AREAS.map(a => [a, 'KV ' + a])]
    .map(([v, l]) => `<button class="${S.area === v ? 'active' : ''}" onclick="setArea('${v}')">${l}</button>`).join('');
  document.querySelectorAll('.area-select').forEach(sel => {
    const v = sel.value;
    sel.innerHTML = '<option value="">— Chưa chọn —</option>' + AREAS.map(a => `<option value="${a}">Khu vực ${a}</option>`).join('');
    sel.value = v;
  });
}

function setArea(a) {
  S.area = a;
  try { localStorage.setItem('area', a); } catch (e) {}
  buildAreaSwitch(); render();
}

// Dữ liệu chưa gán khu vực thì hiện ở mọi khu vực
const inArea = (x) => !S.area || !areaOf(x) || areaOf(x) === S.area;
const areaTag = (x) => areaOf(x) ? `<span class="area-tag">KV ${esc(areaOf(x))}</span>` : '';

function toggleTheme() {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : '';
  try { localStorage.setItem('theme', dark ? 'dark' : ''); } catch (e) {}
}

/* ---------- Lọc ---------- */
function myName() {
  const m = S.members.find(x => x.email && x.email === S.user);
  if (m) return m.name;
  try { return localStorage.getItem('myName') || ''; } catch (e) { return ''; }
}

function setMyName(name) {
  try { localStorage.setItem('myName', name); } catch (e) {}
  render();
}

/* Khi không biết email người dùng (chạy trên GitHub Pages), cho chọn tên */
function renderPickName() {
  $('view').innerHTML = `<div class="panel" style="max-width:420px"><h3>Bạn là ai?</h3>
    <p class="t-sub" style="margin-bottom:12px">Chọn tên để xem công việc được giao cho bạn.</p>
    ${S.members.map(m => `<button class="btn btn-ghost" style="margin:0 8px 8px 0" onclick="setMyName('${esc(m.name)}')">${esc(m.name)}</button>`).join('')}</div>`;
}

function filtered() {
  const q = $('fSearch').value.trim().toLowerCase();
  const st = $('fStatus').value, pr = $('fPriority').value, as = $('fAssignee').value, du = $('fDue').value;
  const me = myName();
  return S.tasks.filter(inArea).filter(t => {
    if (S.view === 'mine' && me && t.assignee !== me) return false;
    if (q && !(`${t.title} ${t.description} ${t.tags} ${t.assignee}`.toLowerCase().includes(q))) return false;
    if (st && t.status !== st) return false;
    if (pr && t.priority !== pr) return false;
    if (as && t.assignee !== as) return false;
    if (du) {
      const n = daysLeft(t.dueDate);
      if (du === 'none' && t.dueDate) return false;
      if (du === 'overdue' && !(n !== null && n < 0 && !isDone(t))) return false;
      if (du === 'today' && n !== 0) return false;
      if (du === 'week' && !(n !== null && n >= 0 && n <= 7)) return false;
    }
    return true;
  }).sort((a, b) => (isDone(a) - isDone(b)) || String(a.dueDate || '9999').localeCompare(String(b.dueDate || '9999')));
}

/* ---------- Hiển thị ---------- */
function render() {
  const v = S.view;
  if (v === 'dashboard') return renderDashboard();
  if (v === 'orders') return renderOrders();
  if (v === 'kanban') return renderKanban(filtered());
  if (v === 'mine' && !myName()) return renderPickName();
  renderList(filtered());
  if (v === 'mine') $('view').insertAdjacentHTML('afterbegin', `<div class="t-sub" style="margin-bottom:10px">Đang xem việc của <b>${esc(myName())}</b> · <a href="#" onclick="setMyName('');return false">Đổi người</a></div>`);
}

function cardHtml(t, withMove) {
  const idx = S.statuses.findIndex(s => s.name === t.status);
  const next = S.statuses[idx + 1];
  return `<div class="task-card" draggable="true" data-id="${esc(t.id)}" style="--prio:${colorOf(S.priorities, t.priority)}" onclick="openForm('${esc(t.id)}')">
    <div class="title">${areaTag(t)}${esc(t.title)}</div>
    ${tagsHtml(t) ? `<div>${tagsHtml(t)}</div>` : ''}
    <div class="row">${dueHtml(t)}${t.assignee ? `<span class="who"><span class="avatar" title="${esc(t.assignee)}">${esc(initials(t.assignee))}</span></span>` : ''}</div>
    ${!withMove ? `<div class="row">${badge(S.statuses, t.status)}${badge(S.priorities, t.priority)}</div>` : ''}
    ${withMove && next ? `<button class="move-btn" onclick="event.stopPropagation();changeStatus('${esc(t.id)}','${esc(next.name)}')">Chuyển sang “${esc(next.name)}” →</button>` : ''}
  </div>`;
}

function renderDashboard() {
  const all = S.tasks.filter(inArea), total = all.length;
  const done = all.filter(isDone).length;
  const overdue = all.filter(t => !isDone(t) && t.dueDate && daysLeft(t.dueDate) < 0);
  const doing = all.filter(t => t.status === 'Đang làm').length;
  const upcoming = all.filter(t => !isDone(t) && t.dueDate && daysLeft(t.dueDate) >= 0 && daysLeft(t.dueDate) <= 7)
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const pct = total ? Math.round(done / total * 100) : 0;
  const bars = (list, key) => list.map(x => {
    const n = all.filter(t => t[key] === x.name).length;
    return `<div class="bar-row"><span class="name">${esc(x.name)}</span><div class="bar"><span style="width:${total ? n / total * 100 : 0}%;background:${x.color || 'var(--primary)'}"></span></div><span class="num">${n}</span></div>`;
  }).join('');
  const byPerson = S.members.map(m => {
    const mine = all.filter(t => t.assignee === m.name);
    const d = mine.filter(isDone).length;
    return `<div class="bar-row"><span class="name">${esc(m.name)}</span><div class="bar"><span style="width:${mine.length ? d / mine.length * 100 : 0}%;background:var(--ok)"></span></div><span class="num">${d}/${mine.length}</span></div>`;
  }).join('');

  const os = orderStats(S.orders.filter(inArea));
  const orderBanner = S.orders.length ? `<div class="panel" style="margin-bottom:16px;cursor:pointer" onclick="setView('orders')">
      <h3>📦 Đơn hàng chưa lấy</h3>
      <div style="display:flex;flex-wrap:wrap;gap:8px 24px">
        <span><b>${os.open}</b> dòng hàng · ${os.customers} khách</span>
        <span style="color:#2563eb"><b>${os.today}</b> khách nhận hôm nay</span>
        <span style="color:var(--danger)"><b>${os.late}</b> quá hẹn</span>
        <span style="color:var(--ok)">Đã lấy <b>${os.pct}%</b></span>
      </div></div>` : '';
  $('view').innerHTML = orderBanner + `
    <div class="stats">
      <div class="stat"><div class="label">Tổng công việc</div><div class="value">${total}</div></div>
      <div class="stat"><div class="label">Đang làm</div><div class="value" style="color:#2563eb">${doing}</div></div>
      <div class="stat"><div class="label">Quá hạn</div><div class="value" style="color:var(--danger)">${overdue.length}</div></div>
      <div class="stat"><div class="label">Hoàn thành</div><div class="value" style="color:var(--ok)">${pct}%</div></div>
    </div>
    <div class="panels">
      <div class="panel mini-list"><h3>⏰ Sắp đến hạn & quá hạn</h3>
        ${[...overdue, ...upcoming].slice(0, 8).map(t => cardHtml(t)).join('') || '<div class="empty">Không có việc gấp 🎉</div>'}
      </div>
      <div>
        <div class="panel" style="margin-bottom:16px"><h3>Theo trạng thái</h3>${bars(S.statuses, 'status')}</div>
        <div class="panel" style="margin-bottom:16px"><h3>Theo mức ưu tiên</h3>${bars(S.priorities, 'priority')}</div>
        <div class="panel"><h3>Tiến độ theo người</h3>${byPerson || '<div class="t-sub">Thêm người trong sheet ThanhVien</div>'}</div>
      </div>
    </div>`;
}

function renderList(list) {
  if (!list.length) { $('view').innerHTML = '<div class="empty">Không có công việc nào phù hợp.</div>'; return; }
  const rows = list.map(t => `<tr onclick="openForm('${esc(t.id)}')">
    <td><div class="t-title">${esc(t.title)}</div><div>${tagsHtml(t)}</div></td>
    <td>${badge(S.statuses, t.status)}</td>
    <td>${badge(S.priorities, t.priority)}</td>
    <td>${t.assignee ? `<span class="who"><span class="avatar">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>` : '<span class="t-sub">—</span>'}</td>
    <td>${dueHtml(t)}</td>
    <td><div class="progress"><span style="width:${t.progress || 0}%"></span></div><div class="t-sub">${t.progress || 0}%</div></td>
  </tr>`).join('');
  $('view').innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Công việc</th><th>Trạng thái</th><th>Ưu tiên</th><th>Phụ trách</th><th>Hạn chót</th><th>Tiến độ</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="cards">${list.map(t => cardHtml(t)).join('')}</div>`;
}

function renderKanban(list) {
  $('view').innerHTML = `<div class="kanban" style="--cols:${S.statuses.length}">${S.statuses.map(s => {
    const items = list.filter(t => t.status === s.name);
    return `<div class="column" data-status="${esc(s.name)}">
      <div class="column-head"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}<span class="count">${items.length}</span></div>
      <div class="column-body">${items.map(t => cardHtml(t, true)).join('')}</div></div>`;
  }).join('')}</div>`;
  bindDrag();
}

/* Kéo thả trên máy tính */
function bindDrag() {
  document.querySelectorAll('.kanban .task-card').forEach(c => {
    c.addEventListener('dragstart', e => { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  document.querySelectorAll('.kanban .column').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drop');
      changeStatus(e.dataTransfer.getData('text/plain'), col.dataset.status);
    });
  });
}

/* ---------- Thao tác dữ liệu ---------- */
async function changeStatus(id, status) {
  const t = S.tasks.find(x => x.id === id);
  if (!t || t.status === status) return;
  const old = { ...t };
  t.status = status; if (status === 'Hoàn thành') t.progress = 100;
  render();
  try { Object.assign(t, await api('updateStatus', id, status)); toast(`Đã chuyển sang “${status}”`); }
  catch (e) { Object.assign(t, old); render(); toast(e, true); }
}

function openForm(id) {
  const f = $('taskForm'); f.reset();
  const t = id ? S.tasks.find(x => x.id === id) : null;
  $('formTitle').textContent = t ? 'Chi tiết công việc' : 'Thêm công việc';
  $('btnDelete').style.display = t ? '' : 'none';
  const data = t || { status: S.statuses[0] && S.statuses[0].name, priority: 'Trung bình', progress: 0, area: S.area, assignee: S.view === 'mine' ? myName() : '' };
  ['id', 'title', 'description', 'status', 'priority', 'assignee', 'area', 'tags', 'startDate', 'dueDate', 'progress'].forEach(k => {
    if (f.elements[k]) f.elements[k].value = data[k] ?? '';
  });
  $('progressVal').textContent = data.progress || 0;
  $('formMeta').textContent = t ? `Mã: ${t.id}${t.createdBy ? ' · Tạo bởi ' + t.createdBy : ''}${t.updatedAt ? ' · Cập nhật ' + t.updatedAt.replace('T', ' ') : ''}` : '';
  $('overlay').classList.add('show');
  if (!t && window.innerWidth > 768) setTimeout(() => f.elements.title.focus(), 50);
}

function closeForm() { $('overlay').classList.remove('show'); }

async function submitForm(e) {
  e.preventDefault();
  const task = Object.fromEntries(new FormData($('taskForm')).entries());
  task.progress = Number(task.progress);
  if (task.status === 'Hoàn thành') task.progress = 100;
  const btn = $('btnSave'); btn.disabled = true; btn.textContent = 'Đang lưu...';
  try {
    const saved = await api('saveTask', task);
    const i = S.tasks.findIndex(x => x.id === saved.id);
    if (i >= 0) S.tasks[i] = saved; else S.tasks.push(saved);
    closeForm(); render(); toast('Đã lưu công việc');
  } catch (err) { toast(err, true); }
  btn.disabled = false; btn.textContent = 'Lưu';
}

async function removeTask() {
  const id = $('taskForm').elements.id.value;
  if (!id || !confirm('Xoá công việc này?')) return;
  try {
    await api('deleteTask', id);
    S.tasks = S.tasks.filter(x => x.id !== id);
    closeForm(); render(); toast('Đã xoá');
  } catch (e) { toast(e, true); }
}

/* ---------- Đơn hàng ---------- */
const ORDER_STATUSES = [
  { name: 'Chưa lấy', color: '#dc2626' },
  { name: 'Lấy một phần', color: '#d97706' },
  { name: 'Đã lấy đủ', color: '#16a34a' },
  { name: 'Huỷ', color: '#94a3b8' }
];
const orderOpen = (o) => o.status === 'Chưa lấy' || o.status === 'Lấy một phần';
const fmtQty = (n) => Number(n || 0).toLocaleString('vi-VN', { maximumFractionDigits: 2 });

function calcOrderStatus(o) {
  if (o.status === 'Huỷ') return 'Huỷ';
  const qty = Number(o.qty) || 0, picked = Number(o.picked) || 0;
  if (qty > 0 && picked >= qty) return 'Đã lấy đủ';
  return picked > 0 ? 'Lấy một phần' : 'Chưa lấy';
}

/* Tách tin Zalo thành các dòng đơn hàng.
 * Mỗi đoạn (cách nhau dòng trống) là một tin: dòng chữ đầu là khách hàng,
 * dòng "mã số_lượng đơn_vị" là hàng, câu có ngày (thứ 2 tuần sau, mai, 05/11...) là ngày nhận. */
const ITEM_RE = /^([A-Za-z0-9][\w.\/-]*\d[\w.\/-]*|[A-Za-z][\w.\/-]*[A-Za-z]\d*|\p{L}[\p{L} ]*\p{L})\s*[:x×\-]?\s*(\d+(?:[.,]\d+)?)\s*(m2|m²|m3|md|m|viên|v|thùng|th|hộp|cái|bộ|kg|tấn|bao|bag|bịch|gói|cuộn|tấm|cây|kiện|pallet|lít|lon)?(?:\s*\+?\s*(\d+)\s*(viên|v))?\.?$/iu;
const NOISE_RE = /^(\d{1,2}:\d{2}.*|hôm nay|hôm qua|đã xem|đã nhận|đã gửi)$/i;

function parseItemLine(line) {
  const out = [];
  for (const part of line.split(/[;,]\s*(?=[A-Za-z0-9])/)) {
    const m = part.trim().match(ITEM_RE);
    if (m && /^\d{1,2}[\/.-]\d{1,2}([\/.-]\d{0,4})?$/.test(part.trim())) return null; // 05/11 là ngày, không phải mã hàng
    if (!m || !/\d/.test(m[1]) && !m[3]) return null;
    const it = { code: m[1].toUpperCase(), qty: Number(m[2].replace(',', '.')), unit: (m[3] || '').toLowerCase().replace('m²', 'm2') };
    if (m[4]) { it.unit = 'thùng'; it.extraV = Number(m[4]); } // "10 thùng 5 viên"
    out.push(it);
  }
  return out.length ? out : null;
}

function parseVnDate(text, base) {
  const t = text.toLowerCase();
  const day0 = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  const add = (n) => { const d = new Date(day0); d.setDate(d.getDate() + n); return d; };
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  let m = t.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);
  if (m) {
    let y = m[3] ? Number(m[3]) : day0.getFullYear();
    if (y < 100) y += 2000;
    const d = new Date(y, Number(m[2]) - 1, Number(m[1]));
    if (!m[3] && d < add(-60)) d.setFullYear(y + 1);
    return iso(d);
  }
  if (/hôm nay|trong ngày|chiều nay|sáng nay|tối nay/.test(t)) return iso(day0);
  if (/ngày mốt|\bmốt\b/.test(t)) return iso(add(2));
  if (/ngày mai|\bmai\b/.test(t)) return iso(add(1));
  const names = { 'hai': 1, 'ba': 2, 'tư': 3, 'bốn': 3, 'năm': 4, 'sáu': 5, 'bảy': 6 };
  m = t.match(/(?:thứ|t)\s*([2-7]|hai|ba|tư|bốn|năm|sáu|bảy)\b|(chủ nhật|\bcn\b)/);
  if (m) {
    const target = m[2] ? 7 : (/\d/.test(m[1]) ? Number(m[1]) - 1 : names[m[1]]); // Thứ 2 = 1 ... CN = 7
    const today = day0.getDay() || 7;
    let diff = target - today;
    if (/tuần sau|tuần tới/.test(t)) diff += 7;
    else if (diff < 0) diff += 7;
    return iso(add(diff));
  }
  return '';
}

/* Cả đơn trên một dòng: "Quỳnh An 2020modern007 18th Mai đem về giùm em" */
const UNITS_RE = 'm2|m²|m3|md|m|viên|v|thùng|th|hộp|cái|bộ|kg|tấn|bao|bag|bịch|gói|cuộn|tấm|cây|kiện|pallet|lít|lon';
const INLINE_RE = new RegExp(`(^|\\s)((?=[\\w.\\/-]*[A-Za-z])[A-Za-z0-9][\\w.\\/-]*\\d[\\w.\\/-]*)\\s*[:x×]?\\s*(\\d+(?:[.,]\\d+)?)\\s*(${UNITS_RE})(?=$|[\\s.,;!])`, 'iu');
function inlineItem(line) {
  const m = line.match(INLINE_RE);
  if (!m) return null;
  const customer = line.slice(0, m.index).trim().replace(/[:\-–,]+$/, '').trim();
  const rest = line.slice(m.index + m[0].length).trim().replace(/^[.,;!\s]+/, '');
  return { customer, rest, item: { code: m[2].toUpperCase(), qty: Number(m[3].replace(',', '.')), unit: m[4].toLowerCase().replace('m²', 'm2') } };
}
/* Tin nhờ đổi mã: "đổi giúp em thành mã 2020modern005" */
const CHANGE_RE = /(?:^|\s)(?:đổi|sửa|chuyển|thay)(?:\s|$).*?(?:thành|sang|qua|bằng)\s+(?:mã\s+)?((?=[\w.\/-]*[A-Za-z])[A-Za-z0-9][\w.\/-]*\d[\w.\/-]*)/iu;

/* Bỏ ký tự rác ở đầu dòng (ảnh đại diện khi đọc ảnh) và @nhắc tên ở cuối */
const cleanLine = (l) => l.replace(/@[\p{L}\s]+$/u, '').replace(/^[^\p{L}\d]+/u, '').trim();

/* Dòng tiêu đề người gửi trên Zalo, dạng "Ngọc Vĩ- Gạch Đồng Tâm" */
function senderOf(line) {
  const m = line.replace(/^\p{L}\s+(?=\p{Lu})/u, '').match(/^([\p{L}\s.]{2,30}?)\s*-\s*\S/u);
  return m ? m[1].trim() : '';
}

/* Tách chữ (dán từ Zalo hoặc đọc từ ảnh) thành các dòng đơn hàng.
 * Dòng chữ ngay trên dòng hàng đầu tiên là tên khách; câu có ngày là ngày nhận;
 * các dòng khác là ghi chú của đơn phía trên. */
function parseZalo(text, base = new Date()) {
  const rows = [];
  let group = [], buffer = [], sender = '', pending = null;
  const addNote = (rs, n) => rs.forEach(r => r.note = [r.note, n].filter(Boolean).join('. '));
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    const l = cleanLine(raw);
    if (l.length < 2 || NOISE_RE.test(l)) continue;
    const chg = l.match(CHANGE_RE);
    if (chg && rows.length) {
      // Đổi mã cho dòng hàng vừa đọc phía trên
      const r = rows[rows.length - 1], nc = chg[1].toUpperCase();
      if (nc !== r.code) { r.oldCode = r.oldCode || r.code; r.code = nc; }
      continue;
    }
    let items = parseItemLine(l), inline = null;
    if (!items && (inline = inlineItem(l))) items = [inline.item];
    if (items) {
      if (inline && inline.customer) {
        if (group.length) addNote(group, buffer.join('. '));
        else buffer.forEach(b => { sender = senderOf(b) || sender; });
        buffer = [];
        group = [];
        group.customer = inline.customer;
      } else if (buffer.length || !group.length) {
        // Bắt đầu đơn mới: dòng chữ cuối cùng phía trên là tên khách
        const customer = buffer.pop() || (group[0] && group[0].customer) || '';
        if (group.length) addNote(group, buffer.join('. '));
        else buffer.forEach(b => { sender = senderOf(b) || sender; });
        buffer = [];
        group = [];
        group.customer = customer;
      }
      items.forEach(it => {
        const r = { customer: group.customer, code: it.code, qty: it.qty, unit: it.unit, extraV: it.extraV, pickupDate: '', note: '' };
        if (pending) { r.pickupDate = pending.date; r.note = pending.note; }
        if (inline && inline.rest) { r.pickupDate = parseVnDate(inline.rest, base) || r.pickupDate; r.note = [r.note, inline.rest].filter(Boolean).join('. '); }
        rows.push(r); group.push(r);
      });
      pending = null;
      continue;
    }
    const d = parseVnDate(l, base);
    if (d && group.length && !buffer.length) {
      group.forEach(r => { if (!r.pickupDate) r.pickupDate = d; });
      addNote(group, l);
    } else if (d && !pending) {
      pending = { date: d, note: l };
    } else {
      buffer.push(l);
    }
  }
  if (group.length) {
    // Dòng cuối ngắn kiểu tên riêng thường là tên khách của tin bị cắt, bỏ qua
    const last = buffer[buffer.length - 1];
    if (last && last.split(/\s+/).length <= 4 && /^\p{Lu}/u.test(last) && !/\d/.test(last)) buffer.pop();
    buffer = buffer.filter(b => b.length > 3); // mẩu chữ rác khi đọc ảnh
    addNote(group, buffer.join('. '));
    if (pending) group.forEach(r => { if (!r.pickupDate) r.pickupDate = pending.date; });
  }
  return { rows, sender };
}

/* Lọc + nhóm */
function filteredOrders() {
  const q = $('oSearch').value.trim().toLowerCase();
  const st = $('oStatus').value, wh = $('oWarehouse').value, se = $('oSender').value;
  return S.orders.filter(inArea).filter(o => {
    if (q && !`${o.customer} ${o.code} ${o.note} ${o.sender} ${o.warehouse} ${o.toWarehouse} ${o.customerSap} ${o.codeSap}`.toLowerCase().includes(q)) return false;
    if (st === 'open' && !orderOpen(o)) return false;
    if (st && st !== 'open' && o.status !== st) return false;
    if (wh && o.warehouse !== wh) return false;
    if (se && o.sender !== se) return false;
    return true;
  });
}

/* Các dòng hàng cùng một đơn (cùng lần dán, cùng khách) gom thành một thẻ */
const orderKey = (o) => o.orderNo || [o.customer, o.createdAt, o.pickupDate].join('|');

function groupOrders(lines) {
  const map = new Map();
  lines.forEach(o => { const k = orderKey(o); if (!map.has(k)) map.set(k, []); map.get(k).push(o); });
  return [...map.entries()].map(([key, ls]) => {
    const open = ls.filter(orderOpen);
    let status = 'Chưa lấy';
    if (!open.length) status = ls.every(o => o.status === 'Huỷ') ? 'Huỷ' : 'Đã lấy đủ';
    else if (open.length < ls.length || ls.some(o => o.picked > 0)) status = 'Lấy một phần';
    return { key, lines: ls, customer: ls[0].customer, status,
      pickupDate: ls.map(o => o.pickupDate).filter(Boolean).sort()[0] || '' };
  });
}

function orderGroups(list) {
  const buckets = [
    { key: 'late', title: '⚠️ Quá hẹn chưa lấy', items: [] },
    { key: 'today', title: '📦 Hôm nay khách nhận', items: [] },
    { key: 'tomorrow', title: 'Ngày mai', items: [] },
    { key: 'soon', title: 'Sắp nhận', items: [] },
    { key: 'nodate', title: 'Chưa hẹn ngày', items: [] },
    { key: 'done', title: '✅ Đã lấy đủ / Huỷ', items: [] }
  ];
  const b = Object.fromEntries(buckets.map(x => [x.key, x]));
  groupOrders(list).forEach(g => {
    if (!orderOpen(g)) return b.done.items.push(g);
    const n = daysLeft(g.pickupDate);
    if (n === null) b.nodate.items.push(g);
    else if (n < 0) b.late.items.push(g);
    else if (n === 0) b.today.items.push(g);
    else if (n === 1) b.tomorrow.items.push(g);
    else b.soon.items.push(g);
  });
  buckets.forEach(x => x.items.sort((p, q) => String(p.pickupDate || '9').localeCompare(String(q.pickupDate || '9')) || p.customer.localeCompare(q.customer)));
  return buckets.filter(x => x.items.length);
}

function pickupHtml(o) {
  if (!o.pickupDate) return '<span class="t-sub">Chưa hẹn ngày</span>';
  const n = daysLeft(o.pickupDate);
  const wd = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][new Date(o.pickupDate + 'T00:00').getDay()];
  let cls = '', extra = '';
  if (orderOpen(o)) {
    if (n < 0) { cls = 'overdue'; extra = ` · trễ ${-n} ngày`; }
    else if (n === 0) { cls = 'soon'; extra = ' · hôm nay'; }
    else if (n === 1) { cls = 'soon'; extra = ' · ngày mai'; }
  }
  return `<span class="due ${cls}">${wd} ${fmtDate(o.pickupDate)}${extra}</span>`;
}

function orderLineHtml(o) {
  const c = colorOf(ORDER_STATUSES, o.status);
  return `<div class="order-line" style="--lc:${c}" onclick="event.stopPropagation();S.selecting ? toggleSel(this.closest('.order-card').dataset.key) : openOrder('${esc(o.id)}')">
    <span><b>${esc(o.code)}</b>${o.codeSap && o.codeSap !== o.code ? ` <span class="t-sub">· SAP ${esc(o.codeSap)}</span>` : ''}</span>
    <span class="qty">${fmtQty(o.qty)} ${esc(o.unit)}${convText(o) ? `<span class="conv">≈ ${convText(o)}</span>` : ''}</span>
    <div class="sub"><span style="color:${c}">● ${esc(o.status)} · đã lấy ${fmtQty(o.picked)}/${fmtQty(o.qty)}</span>
      ${orderOpen(o) ? `<button class="pick" onclick="event.stopPropagation();markPicked(['${esc(o.id)}'])">✓ Lấy đủ</button>` : ''}</div>

}

    <div class="row" style="margin-top:0">${sel ? `<input type="checkbox" class="sel" ${on ? 'checked' : ''} onclick="event.stopPropagation();toggleSel(this.closest('.order-card').dataset.key)">` : ''}<div class="title">${areaTag(f)}${g.lines.some(isTransfer) ? '<span class="transfer-tag">🚚 Điều chuyển</span>' : ''}${esc(g.customer)}</div>${badge(ORDER_STATUSES, g.status)}</div>
    ${f.customerSap ? `<div class="t-sub">KH SAP: ${esc(f.customerSap)}</div>` : ''}

    ${f.warehouse || f.toWarehouse ? `<div class="t-sub" style="margin-top:6px">🏭 ${esc(f.warehouse || '?')} → 📍 ${esc(f.toWarehouse || '?')}</div>` : ''}

    <div class="card-actions">

      <button class="move-btn" style="display:inline-block" onclick="event.stopPropagation();exportGroup(this.closest('.order-card').dataset.key)">⬇ Xuất EX</button>
      ${openIds ? `<button class="move-btn" style="display:inline-block" onclick="event.stopPropagation();markPicked([${openIds}])">✓ Khách đã lấy đủ cả đơn</button>` : ''}
    </div>
  </div>`;
}

function orderStats(list) {
  const open = list.filter(orderOpen);
  const active = list.filter(o => o.status !== 'Huỷ');
  const qty = active.reduce((s, o) => s + (Number(o.qty) || 0), 0);
  const picked = active.reduce((s, o) => s + Math.min(Number(o.picked) || 0, Number(o.qty) || 0), 0);
  return {
    open: open.length,
    openOrders: groupOrders(open).length,
    customers: new Set(open.map(o => o.customer)).size,
    today: open.filter(o => daysLeft(o.pickupDate) === 0).length,
    late: open.filter(o => o.pickupDate && daysLeft(o.pickupDate) < 0).length,
    pct: qty ? Math.round(picked / qty * 100) : 0
  };
}

function buildOrderSelects() {
  const uniq = (k) => [...new Set(S.orders.map(o => o[k]).filter(Boolean))].sort();

  keep('oSender', '<option value="">Mọi người gửi</option>' + uniq('sender').map(x => `<option>${esc(x)}</option>`).join(''));
  const merge = (a, b) => [...new Set([...a, ...b])].sort();
  $('dlCustomers').innerHTML = merge(S.customers.map(c => c.name), uniq('customer')).map(x => `<option value="${esc(x)}">`).join('');
  $('dlCodes').innerHTML = merge(S.items.map(i => i.code), uniq('code')).map(x => `<option value="${esc(x)}">`).join('');
  $('dlToWarehouses').innerHTML = uniq('toWarehouse').map(x => `<option value="${esc(x)}">`).join('');
  $('dlWarehouses').innerHTML = uniq('warehouse').map(x => `<option value="${esc(x)}">`).join('');
  $('dlSenders').innerHTML = uniq('sender').map(x => `<option value="${esc(x)}">`).join('');
}

      <button class="btn btn-primary" onclick="exportSelected(true)" ${S.sel.size ? '' : 'disabled'}>Gộp thành 1 đơn lớn → EX</button>

/* Dán tin Zalo */
function openPaste() {
  $('pasteText').value = '';
  $('pastePreview').innerHTML = '';
  $('btnSaveParsed').style.display = 'none';
  $('pasteArea').value = S.area;
  $('pasteDate').value = todayStr();

function closePaste() { $('pasteOverlay').classList.remove('show'); }

/* Tra danh mục (sheet KhachHang / MaHang), nếu chưa có thì lấy từ đơn cũ gần nhất */
const sameKey = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
function catalogOf(keyField, keyVal) {
  if (!String(keyVal || '').trim()) return null;
  return keyField === 'customer'
    ? S.customers.find(c => sameKey(c.name, keyVal))
    : S.items.find(i => sameKey(i.code, keyVal));
}

function sapOf(keyField, keyVal, field) {
  const c = catalogOf(keyField, keyVal);
  if (c && c[field]) return c[field];
  for (let i = S.orders.length - 1; i >= 0; i--) {
    const o = S.orders[i];
    if (o[field] && sameKey(o[keyField], keyVal)) return o[field];
  }
  return '';
}

/* Tự điền mã SAP, kho nhận, ĐVT khi gõ khách hàng / mã hàng (chỉ điền ô đang trống) */
function fillSap(scope) {
  const get = (k) => scope.querySelector(`[data-k="${k}"], [name="${k}"]`);
  [['customer', 'customerSap'], ['customer', 'toWarehouse'], ['code', 'codeSap'], ['code', 'unit'], ['code', 'perBox'], ['code', 'm2PerBox']].forEach(([k, f]) => {
    const inp = get(f), src = get(k);
    if (inp && src && !inp.value) inp.value = sapOf(k, src.value, f) || '';
  });
  if (scope.elements && scope.elements.boxTh) syncBoxes(scope);
}

/* Cập nhật danh mục trong máy sau khi lưu (máy chủ cũng tự cập nhật sheet) */
function rememberCatalog(orders) {
  orders.forEach(o => {
    const c = catalogOf('customer', o.customer);
    if (c) { if (o.customerSap) c.customerSap = o.customerSap; if (o.toWarehouse) c.toWarehouse = o.toWarehouse; }
    else if (o.customer) S.customers.push({ name: o.customer, customerSap: o.customerSap || '', toWarehouse: o.toWarehouse || '' });
    const it = catalogOf('code', o.code);
    if (it) { if (o.codeSap) it.codeSap = o.codeSap; if (o.unit) it.unit = o.unit; if (o.perBox) it.perBox = Number(o.perBox); if (o.m2PerBox) it.m2PerBox = Number(o.m2PerBox); }
    else if (o.code) S.items.push({ code: o.code, codeSap: o.codeSap || '', unit: o.unit || '', perBox: Number(o.perBox) || 0, m2PerBox: Number(o.m2PerBox) || 0 });
  });
}

/* Xem trước khi lưu: mỗi đơn là một khung
 * đầu khung: khách hàng, code khách, người đặt; giữa: từng mã hàng một dòng; cuối: ngày lấy hàng, ghi chú */
function normExtraV(r) {
  if (r.extraV) {
    // "10 thùng 5 viên": đổi ra tổng số viên nếu biết số viên/thùng, không thì ghi chú lại
    const { perBox } = convOf(r);
    if (perBox) { r.qty = r.qty * perBox + r.extraV; r.unit = 'viên'; }
    else r.extraLine = { ...r, qty: r.extraV, unit: 'viên', extraV: 0 };
    delete r.extraV;
  }
}
function parsedLineHtml(r) {
  normExtraV(r);
  return `<div class="parsed-row pline">
      <input data-k="code" list="dlCodes" value="${esc(r.code)}" placeholder="Mã hàng" onchange="fillSap(this.parentElement)">
      <input data-k="codeSap" value="${esc(r.codeSap ?? sapOf('code', r.code, 'codeSap'))}" placeholder="Mã hàng SAP">
      <div class="qty-unit"><input data-k="qty" type="number" step="any" value="${r.qty}" placeholder="SL"><input data-k="unit" value="${esc(r.unit || sapOf('code', r.code, 'unit'))}" placeholder="ĐVT"></div>
      <input data-k="lot" value="${esc(r.lot || '')}" placeholder="Lô">
      ${r.replaceId ? `<input type="hidden" data-k="replaceId" value="${esc(r.replaceId)}">` : ''}
      ${r.oldCode ? `<div class="pl-hint">🔁 Đổi từ mã ${esc(r.oldCode)}${r.replaceId ? ' · sẽ sửa đơn cũ đã lưu, không tạo đơn mới' : ''}</div>` : ''}
      <button type="button" class="icon-btn" title="Bỏ mã này" onclick="this.parentElement.remove()">✕</button>
    </div>`;
}

function parsedGroupHtml(g) {
  const wh = $('pasteWarehouse').value.trim(), toWh = $('pasteToWarehouse').value.trim();
  // Chưa biết số viên/thùng: phần viên lẻ hiện thành một dòng riêng cùng mã
  // Dòng được nhờ đổi mã: nếu đơn cũ (khách + mã cũ) đang chưa lấy thì sửa đơn đó thay vì tạo đơn mới
  g.lines.forEach(r => {
    if (!r.oldCode || r.replaceId) return;
    const old = S.orders.find(o => orderOpen(o) && sameKey(o.customer, g.customer) && sameKey(o.code, r.oldCode));
    if (old) r.replaceId = old.id;
  });
  g.lines = g.lines.flatMap(r => { normExtraV(r); const x = r.extraLine; delete r.extraLine; return x ? [r, x] : [r]; });
  const notes = [...new Set([g.note, ...g.lines.map(l => l.note)].filter(Boolean))].join('. ');
  return `<div class="pgroup">
    <div class="pg-head">
      <div class="field pg-cust"><label>Khách hàng</label><input data-k="customer" list="dlCustomers" value="${esc(g.customer)}" placeholder="Tên khách" onchange="fillSap(this.closest('.pg-head'))"></div>
      <div class="field"><label>Code khách hàng</label><input data-k="customerSap" value="${esc(g.customerSap ?? sapOf('customer', g.customer, 'customerSap'))}" placeholder="Mã KH SAP"></div>
      <div class="field"><label>Người đặt hàng</label><input data-k="sender" list="dlSenders" value="${esc(g.sender ?? $('pasteSender').value)}" placeholder="Ví dụ: Ngọc Vĩ"></div>
      <div class="field"><label>Kho lấy</label><input data-k="warehouse" list="dlWarehouses" value="${esc(g.warehouse ?? wh)}"></div>
      <div class="field"><label>Kho nhận</label><input data-k="toWarehouse" list="dlToWarehouses" value="${esc(g.toWarehouse ?? (toWh || sapOf('customer', g.customer, 'toWarehouse')))}"></div>
      <button type="button" class="icon-btn" title="Bỏ cả đơn này" onclick="this.closest('.pgroup').remove()">✕</button>
    </div>
    <div class="pg-cols"><span>Mã hàng</span><span>Mã hàng SAP</span><span>Số lượng · ĐVT</span><span>Lô</span></div>
    <div class="pg-lines">${g.lines.map(parsedLineHtml).join('')}</div>
    <button type="button" class="pg-add" onclick="addParsedLine(this)">+ Thêm mã hàng</button>
    <div class="pg-foot">
      <div class="field"><label>Ngày lấy hàng</label><input data-k="pickupDate" type="date" value="${esc(g.pickupDate || '')}"></div>
      <div class="field"><label>Ghi chú</label><input data-k="note" value="${esc(notes)}"></div>
    </div>
  </div>`;
}

/* Các dòng tách được → nhóm theo khách (giữ thứ tự trong tin) */
function toGroups(rows) {
  const out = [];
  rows.forEach(r => {
    let g = out.find(x => sameKey(x.customer, r.customer));
    if (!g) out.push(g = { customer: r.customer, pickupDate: '', note: '', lines: [] });
    if (!g.pickupDate) g.pickupDate = r.pickupDate;
    g.lines.push(r);
  });
  return out;
}

function previewParsed() {
  const { rows, sender } = parseZalo($('pasteText').value);
  if (sender) $('pasteSender').value = sender;
  const groups = toGroups(rows);
  const msg = rows.length
    ? `Tách được ${groups.length} đơn, ${rows.length} mã hàng. Kiểm tra và sửa nếu cần:`
    : 'Chưa tách được dòng hàng nào (dòng hàng thường có dạng <b>mã_hàng số_lượng</b>, ví dụ <b>2080banyan002 20m</b>). Chị có thể gõ tay bên dưới:';
  if (!groups.length) groups.push({ customer: '', pickupDate: '', note: '', lines: [{ code: '', qty: '', unit: '' }] });
  showGroups(groups, msg);
}

/* Hiện các đơn để kiểm tra; append = true thì thêm vào dưới các đơn đang có */
function showGroups(groups, msg, append) {
  if (append && $('parsedRows')) {
    // Bỏ khung trống (chưa gõ gì) trước khi thêm
    $('parsedRows').querySelectorAll('.pgroup').forEach(g => { if (![...g.querySelectorAll('[data-k=customer], [data-k=code]')].some(i => i.value.trim())) g.remove(); });
    $('parsedRows').insertAdjacentHTML('beforeend', groups.map(parsedGroupHtml).join(''));
    $('pastePreview').querySelector('.t-sub').innerHTML = msg;
  } else {
    $('pastePreview').innerHTML = `<div class="t-sub" style="margin:4px 0 8px">${msg}</div><div id="parsedRows">${groups.map(parsedGroupHtml).join('')}</div>
    <button type="button" class="btn btn-ghost" style="margin-top:4px" onclick="addParsedRow()">+ Thêm đơn khách khác</button>`;
  }
  $('btnSaveParsed').style.display = '';
}

function addParsedLine(btn) {
  const box = btn.closest('.pgroup').querySelector('.pg-lines');
  const last = box.lastElementChild;
  box.insertAdjacentHTML('beforeend', parsedLineHtml({ code: '', qty: '', unit: last ? last.querySelector('[data-k="unit"]').value : '' }));
  box.lastElementChild.querySelector('[data-k="code"]').focus();
}

function addParsedRow() {
  $('parsedRows').insertAdjacentHTML('beforeend', parsedGroupHtml({ customer: '', pickupDate: '', note: '', lines: [{ code: '', qty: '', unit: '' }] }));
  $('parsedRows').lastElementChild.querySelector('[data-k="customer"]').focus();
}

async function saveParsed() {
  const createdAt = $('pasteDate').value || todayStr();
  const stamp = createdAt.slice(2).replace(/-/g, '') + '-' + Date.now().toString(36).slice(-4).toUpperCase();
  const rows = [];
  let bad = '';
  [...document.querySelectorAll('#pastePreview .pgroup')].forEach((gEl, gi) => {
    const head = {};
    gEl.querySelectorAll('.pg-head [data-k], .pg-foot [data-k]').forEach(inp => head[inp.dataset.k] = inp.value.trim());
    // Mỗi khung là một đơn, các mã trong khung dùng chung mã đơn
    const orderNo = `DH${stamp}${gi}`;
    gEl.querySelectorAll('.pline').forEach(el => {
      const o = { ...head, createdAt, picked: 0, status: 'Chưa lấy', area: $('pasteArea').value, orderNo };
      el.querySelectorAll('[data-k]').forEach(inp => o[inp.dataset.k] = inp.value.trim());
      o.qty = Number(o.qty) || 0;
      if (o.replaceId) {
        // Giữ mã đơn, ngày đặt, số đã lấy của đơn cũ
        const old = S.orders.find(x => x.id === o.replaceId) || {};
        Object.assign(o, { id: o.replaceId, orderNo: old.orderNo || o.orderNo, createdAt: old.createdAt || o.createdAt, picked: old.picked || 0 });
        o.note = [o.note, `đổi từ mã ${old.code}`].filter(Boolean).join('. ');
        o.status = calcOrderStatus(o);
      }
      delete o.replaceId;
      o.area = areaOf(o);
      if (!bad && (!o.customer || !o.code)) bad = `Đơn ${gi + 1} thiếu khách hàng hoặc mã hàng`;
      rows.push(o);
    });
  });
  if (!rows.length) return toast('Không có dòng nào để lưu', true);
  if (bad) return toast(bad, true);
  const nOrders = new Set(rows.map(o => o.orderNo)).size;
  // Cảnh báo khi dòng giống hệt một đơn chưa lấy đã lưu (dán trùng tin)
  const key = (o) => [o.customer, o.code, Number(o.qty), o.pickupDate || ''].join('|').toLowerCase();
  const existing = new Set(S.orders.filter(orderOpen).map(key));
  const dup = rows.filter(o => !o.id && existing.has(key(o)));
  if (dup.length && !confirm(`${dup.length} dòng đã có rồi (${dup.map(o => o.customer + ' · ' + o.code).join(', ')}).\nVẫn lưu thêm?`)) return;
  try { localStorage.setItem('lastSender', rows[rows.length - 1].sender || ''); localStorage.setItem('lastWarehouse', $('pasteWarehouse').value.trim()); localStorage.setItem('lastToWarehouse', $('pasteToWarehouse').value.trim()); } catch (e) {}
  const btn = $('btnSaveParsed'); btn.disabled = true; btn.textContent = 'Đang lưu...';
  try {
    const saved = await api('saveOrders', rows);
    saved.forEach(sv => { const i = S.orders.findIndex(x => x.id === sv.id); if (i >= 0) S.orders[i] = sv; else S.orders.push(sv); });
    rememberCatalog(saved);
    const changed = rows.filter(o => o.id).length;
    closePaste(); render(); toast(`Đã lưu ${nOrders} đơn, ${saved.length} mã hàng${changed ? ` (sửa ${changed} đơn cũ)` : ''}`);
  } catch (e) { toast(e, true); }
  btn.disabled = false; btn.textContent = 'Lưu đơn hàng';
}
